name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build MkDocs-Kit Site & Publish to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            plantuml \
            graphviz \
            libpango-1.0-0 \
            libharfbuzz0b \
            libpangoft2-1.0-0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: doc/requirements.txt

      - name: Clone mkdocs-kit
        run: |
          git clone https://github.com/mlecabellec/mkdocs-kit.git .cache/mkdocs-kit

      - name: Install Python Documentation Dependencies
        run: |
          pip install --upgrade pip
          pip install "setuptools<82.0.0"
          pip install -r doc/requirements.txt
          pip install -e .cache/mkdocs-kit

      - name: Build Documentation Site
        run: |
          cd doc
          PYTHONPATH=../.cache/mkdocs-kit/src python3 ../.cache/mkdocs-kit/src/mkdocs_kit/cli.py build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
