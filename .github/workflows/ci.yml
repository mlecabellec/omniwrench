name: Omniwrench CI

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Compile, Static Analysis & Unit Tests
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Build, Analyse & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile all modules
        run: mvn clean compile --batch-mode -q

      - name: Run Checkstyle (all modules)
        run: mvn checkstyle:check --batch-mode -q || true

      - name: Run PMD (all modules)
        run: mvn pmd:check --batch-mode -q || true

      - name: Run all unit tests
        run: mvn test --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Package Fat JAR Artifact
  # ─────────────────────────────────────────────────────────────────
  package-jvm:
    name: Package Fat JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Spring Boot Fat JAR (skip tests)
        run: mvn clean package -Pjvm-package -DskipTests --batch-mode -q

      - name: Locate produced JAR
        id: find-jar
        run: |
          JAR=$(find omniwrench-app/target -name "*.jar" ! -name "*plain*" ! -name "*.original" | head -1)
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename $JAR)" >> "$GITHUB_OUTPUT"

      - name: Upload Fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-fat-jar
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Build GraalVM Native Image
  # ─────────────────────────────────────────────────────────────────
  package-native:
    name: Build GraalVM Native Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Verify GraalVM Native Image Environment
        run: |
          java -version
          native-image --version

      - name: Build GraalVM Native Binary
        run: mvn clean package -Pnative -DskipTests --batch-mode

      - name: Locate Native Binary
        id: find-binary
        run: |
          BINARY="omniwrench-app/target/omniwrench"
          if [[ -f "$BINARY" ]]; then
            echo "binary_path=$BINARY" >> "$GITHUB_OUTPUT"
          else
            echo "Native binary not found at standard path" >&2
            exit 1
          fi

      - name: Upload Native Binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-native-linux-x64
          path: ${{ steps.find-binary.outputs.binary_path }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Build Documentation HTML + PDF
  # ─────────────────────────────────────────────────────────────────
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build documentation site (Dockerized)
        run: |
          docker build -t omniwrench-docs-builder -f doc/Dockerfile .
          docker run --rm -v $(pwd):/app -w /app bash ./doc/build_docs_wrapper.sh

      - name: Upload HTML documentation site
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-docs-html
          path: doc/site/
          retention-days: 30

      - name: Upload PDF manual
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-docs-pdf
          path: doc/site/*.pdf
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 5: GitHub Release on version tags
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ test, package-jvm, package-native, docs ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Fat JAR
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-fat-jar
          path: release-assets/

      - name: Download Native Binary
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-native-linux-x64
          path: release-assets/


      - name: Download HTML site
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-docs-html
          path: release-assets/site/

      - name: Download PDF manual
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-docs-pdf
          path: release-assets/

      - name: Archive documentation site as zip
        run: |
          cd release-assets
          zip -r omniwrench-docs-site-${{ github.ref_name }}.zip site/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Omniwrench ${{ github.ref_name }}"
          body: |
            ## Omniwrench ${{ github.ref_name }}

            ### Released Artifacts

            | File | Description |
            |---|---|
            | `omniwrench` | GraalVM Native Image binary (instant <20ms startup) |
            | `omniwrench-app-*.jar` | Spring Boot fat JAR — runs TUI and Web modes |
            | `omniwrench-docs-site-*.zip` | Full HTML documentation site |
            | `omniwrench-manual.pdf` | PDF reference manual |

            ### Usage

            ```bash
            # GraalVM Native Binary (Instant Execution)
            ./omniwrench tui
            ./omniwrench server

            # JVM Fat JAR
            java -jar omniwrench-app-${{ steps.version.outputs.version }}.jar --tui
            java -jar omniwrench-app-${{ steps.version.outputs.version }}.jar --server
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*omniwrench*
            release-assets/*.jar
            release-assets/*.zip
            release-assets/*.pdf

