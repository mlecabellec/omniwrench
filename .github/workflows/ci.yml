name: Omniwrench CI

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Compile, Static Analysis & Unit Tests
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Build, Analyse & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compile all modules
        run: mvn clean compile --batch-mode -q

      - name: Run Checkstyle (all modules)
        run: mvn checkstyle:check --batch-mode -q || true

      - name: Run PMD (all modules)
        run: mvn pmd:check --batch-mode -q || true

      - name: Run all unit tests
        run: mvn test --batch-mode

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/target/surefire-reports/*.txt
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Package Fat JAR Artifact
  # ─────────────────────────────────────────────────────────────────
  package-jvm:
    name: Package Fat JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build Spring Boot Fat JAR (skip tests)
        run: mvn clean package -Pjvm-package -DskipTests --batch-mode -q

      - name: Locate produced JAR
        id: find-jar
        run: |
          JAR=$(find omniwrench-app/target -name "*.jar" ! -name "*plain*" ! -name "*.original" | head -1)
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename $JAR)" >> "$GITHUB_OUTPUT"

      - name: Upload Fat JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-fat-jar
          path: ${{ steps.find-jar.outputs.jar_path }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Build GraalVM Native Image
  # ─────────────────────────────────────────────────────────────────
  package-native:
    name: Build GraalVM Native Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Verify GraalVM Native Image Environment
        run: |
          java -version
          native-image --version

      - name: Build GraalVM Native Binary
        run: mvn clean package -Pnative -DskipTests --batch-mode

      - name: Locate Native Binary
        id: find-binary
        run: |
          BINARY="omniwrench-app/target/omniwrench"
          if [[ -f "$BINARY" ]]; then
            echo "binary_path=$BINARY" >> "$GITHUB_OUTPUT"
          else
            echo "Native binary not found at standard path" >&2
            exit 1
          fi

      - name: Upload Native Binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-native-linux-x64
          path: ${{ steps.find-binary.outputs.binary_path }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3B: Build Fully Static GraalVM Native Image (Approach 2)
  # ─────────────────────────────────────────────────────────────────
  package-static-native:
    name: Build Static Native Image (musl)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Static Native Binary in GraalVM musl Container
        run: |
          ./helpers/build-static-native.sh --docker --clean

      - name: Verify and Locate Static Binary
        id: find-static-binary
        run: |
          STATIC_BIN="omniwrench-app/target/omniwrench-static"
          if [[ ! -f "$STATIC_BIN" ]]; then
            STATIC_BIN="omniwrench-app/target/omniwrench"
          fi
          if [[ -f "$STATIC_BIN" ]]; then
            echo "static_path=$STATIC_BIN" >> "$GITHUB_OUTPUT"
            file "$STATIC_BIN"
          else
            echo "Static binary not found at standard path" >&2
            exit 1
          fi

      - name: Upload Static Native Binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-static-linux-x64
          path: ${{ steps.find-static-binary.outputs.static_path }}
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 3C: Package Self-Contained AppImage Bundle (Approach 3)
  # ─────────────────────────────────────────────────────────────────
  package-appimage:
    name: Package AppImage Bundle
    runs-on: ubuntu-latest
    needs: [ test, package-jvm ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download Fat JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-fat-jar
          path: omniwrench-app/target/

      - name: Install AppImage Tooling Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfuse2 file

      - name: Build AppImage and Relocatable Tarball
        run: |
          ./helpers/build-appimage.sh --mode jvm

      - name: Upload AppImage and Distribution Bundle
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-appimage-linux-x64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 4: Build Documentation HTML + PDF
  # ─────────────────────────────────────────────────────────────────
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build documentation site (Dockerized)
        run: |
          docker build -t omniwrench-docs-builder -f doc/Dockerfile .
          docker run --rm -v $(pwd):/app -w /app bash ./doc/build_docs_wrapper.sh

      - name: Upload HTML documentation site
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-docs-html
          path: doc/site/
          retention-days: 30

      - name: Upload PDF manual
        uses: actions/upload-artifact@v4
        with:
          name: omniwrench-docs-pdf
          path: doc/site/*.pdf
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # JOB 5: GitHub Release on version tags
  # ─────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [ test, package-jvm, package-native, package-static-native, package-appimage, docs ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Fat JAR
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-fat-jar
          path: release-assets/

      - name: Download Native Binary
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-native-linux-x64
          path: release-assets/

      - name: Download Static Native Binary (Approach 2)
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-static-linux-x64
          path: release-assets/

      - name: Download AppImage Bundle (Approach 3)
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-appimage-linux-x64
          path: release-assets/

      - name: Download HTML site
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-docs-html
          path: release-assets/site/

      - name: Download PDF manual
        uses: actions/download-artifact@v4
        with:
          name: omniwrench-docs-pdf
          path: release-assets/

      - name: Archive documentation site as zip
        run: |
          cd release-assets
          zip -r omniwrench-docs-site-${{ github.ref_name }}.zip site/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Omniwrench ${{ github.ref_name }}"
          body: |
            ## Omniwrench ${{ github.ref_name }}

            ### Released Artifacts

            | File | Description | Native Dependencies |
            |---|---|---|
            | `Omniwrench-*.AppImage` | Self-contained AppImage bundle with custom JRE and launcher | Fully bundled |
            | `omniwrench-*-bundle-linux-x86_64.tar.gz` | Relocatable standalone application folder bundle | Fully bundled |
            | `omniwrench-static` | Fully static GraalVM Native Image binary (musl libc) | Zero host dependencies |
            | `omniwrench` | Dynamic GraalVM Native Image binary (<20ms startup) | Requires host glibc |
            | `omniwrench-app-*.jar` | Standard Spring Boot fat JAR | Requires host JRE 17+ |
            | `omniwrench-docs-site-*.zip` | Full offline HTML documentation site | N/A |
            | `omniwrench-manual.pdf` | Styled PDF reference manual | N/A |

            ### Usage

            ```bash
            # 1. Self-Contained AppImage (All-in-one with bundled runtime)
            chmod +x Omniwrench-*.AppImage
            ./Omniwrench-*.AppImage tui

            # 2. Fully Static Binary (Zero host libc dependencies)
            chmod +x omniwrench-static
            ./omniwrench-static tui

            # 3. Dynamic Native Binary
            ./omniwrench tui

            # 4. Standard JVM Fat JAR
            java -jar omniwrench-app-${{ steps.version.outputs.version }}.jar --tui
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/*omniwrench*
            release-assets/*.AppImage
            release-assets/*.tar.gz
            release-assets/*.jar
            release-assets/*.zip
            release-assets/*.pdf

