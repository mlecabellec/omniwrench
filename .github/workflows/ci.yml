name: Omniwrench CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  quality-and-test:
    name: Code Quality & Multi-Module Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Run All Module Tests
        run: mvn clean test --batch-mode

  docs-build:
    name: MkDocs-Kit Documentation & PlantUML Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Documentation Site & PDF
        run: ./helpers/build-docs.sh build
