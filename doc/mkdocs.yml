site_name: Omniwrench Documentation
use_directory_urls: false

plugins:
  - search

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
  palette:
    - scheme: slate          # Dark mode (default)
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default        # Light mode
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

nav:
  - Welcome: index.md
  - Topics Index: topics_index.md
  - User Guide:
      - Quick Start & Overview: user_guide/overview.md
      - Modern Cyberpunk TUI Guide: user_guide/tui_guide.md
      - Web & Telemetry Dashboard: user_guide/web_guide.md
      - Configuration & Environment: user_guide/configuration_guide.md
      - Workflows & Operations: user_guide/workflows.md
  - Architecture:
